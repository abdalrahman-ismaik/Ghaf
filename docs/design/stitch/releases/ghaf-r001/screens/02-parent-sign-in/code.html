<style>
        .dot-pattern {
            background-image: radial-gradient(circle, #6f7973 1px, transparent 1px);
            background-size: 24px 24px;
            opacity: 0.05;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-pearl-ground dark:bg-background text-on-surface h-screen w-full overflow-hidden flex flex-col items-center justify-center relative font-body-md text-body-md">
<!-- Texture Layer -->
<div class="absolute inset-0 dot-pattern pointer-events-none z-0"></div>
<!-- Atmospheric SVG Mask / Organic Shapes (Subtle) -->
<svg class="absolute inset-0 w-full h-full text-surface-container-low z-0 opacity-50" preserveAspectRatio="none" viewBox="0 0 100 100">
<path d="M0,0 Q50,20 100,0 L100,100 L0,100 Z" fill="currentColor"></path>
</svg>
<!-- Mobile Container constraint for previewing Android-first 390x844 layout -->
<main class="relative z-10 w-full max-w-[390px] h-full max-h-[844px] bg-pearl-ground shadow-2xl flex flex-col md:rounded-3xl overflow-hidden mx-auto">
<!-- TopAppBar (from JSON specification + Contextual Hiding Navigation logic applied since this is a Linear/Transactional page, ONLY the TopAppBar is shown, BottomNav is suppressed) -->
<header class="flex items-center justify-between px-margin-mobile w-full h-16 dir-rtl bg-transparent z-20 shrink-0"><div class="w-10 h-10 flex items-center justify-center"><button aria-label="Back" class="w-touch-target h-touch-target flex items-center justify-center text-on-surface-variant hover:bg-surface-container-low/50 active:scale-95 duration-150 rounded-full transition-colors"><span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span></button></div><div class="flex-1 flex justify-center"><span class="font-headline-lg text-primary dark:text-primary-fixed-dim tracking-tight">غاف</span></div><div class="w-10 h-10"></div></header>
<!-- Main Content Canvas (The "Organic Lift") -->
<div class="flex-1 flex flex-col px-margin-mobile pt-8 pb-6 overflow-y-auto relative z-10">
<div class="flex flex-col gap-unit-2 mb-10 -mt-[44px]">
<h1 class="font-headline-lg text-headline-lg text-on-surface">مرحبًا بوليّ الأمر</h1>
<p class="font-body-md text-body-md text-on-surface-variant">سجّل الدخول لإدارة مهام العائلة وخصوصيتها.</p>
</div>
<!-- Focused Input Form -->
<form class="flex flex-col gap-6 w-full max-w-sm mx-auto" onsubmit="event.preventDefault();">
<div class="flex flex-col gap-2 relative">
<label class="font-label-md text-label-md text-on-surface" for="login-id">رقم الهاتف أو البريد الإلكتروني</label>
<div class="relative group">
<input class="w-full h-[56px] px-4 py-3 rounded-xl bg-surface-container-low border-none shadow-sm focus:ring-2 focus:ring-ghaf-emerald focus:bg-surface text-on-surface placeholder:text-outline transition-all font-body-md text-body-md" id="login-id" name="login-id" placeholder="أدخل رقم الهاتف أو البريد الإلكتروني" type="text">
<!-- Biometric quick action inside input (optional alternative placement, moving to secondary actions below) -->
</div>
<span class="font-label-md text-label-md text-on-surface-variant px-1">مثال: +971 50 123 4567</span>
</div>
<!-- Primary Action -->
<button class="w-full h-[56px] bg-ghaf-emerald hover:bg-primary-container active:scale-[0.98] text-on-primary font-label-md text-label-md rounded-2xl shadow-sm transition-all flex items-center justify-center mt-2" type="submit">
                    متابعة
                </button>
<!-- Divider -->
<div class="flex items-center gap-4 my-2 opacity-60">
<div class="h-px bg-outline-variant flex-1"></div>
<span class="font-label-sm text-label-sm text-outline">أو</span>
<div class="h-px bg-outline-variant flex-1"></div>
</div>
<!-- Secondary Actions -->
<button class="w-full h-[56px] bg-surface-container-low hover:bg-surface-container-high active:scale-[0.98] text-on-surface font-label-md text-label-md rounded-2xl shadow-sm transition-all flex items-center justify-center gap-3" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="fingerprint" data-weight="fill" style="font-variation-settings: 'FILL' 1;">fingerprint</span>
                    الدخول بالبصمة
                </button>
<div class="flex justify-center mt-4">
<a class="font-label-md text-ghaf-emerald hover:text-primary-container transition-colors p-2 flex items-center h-touch-target rounded-full hover:bg-ghaf-emerald/5 text-body-md" href="#">
                        إنشاء عائلة جديدة
                    </a>
</div>
</form>
<div class="mt-auto pt-8"></div>
</div>
<!-- Safe Area Footer -->
<footer class="w-full pb-8 pt-4 px-margin-mobile flex justify-center bg-transparent shrink-0 z-10 backdrop-blur-sm bg-pearl-ground/80">
<div class="px-4 py-1.5 rounded-full bg-surface-container-low border border-surface-variant flex items-center gap-2">
<span class="w-2 h-2 rounded-full bg-tertiary-fixed-dim animate-pulse"></span>
<span class="font-label-sm text-label-sm text-on-surface">نسخة تجريبية ببيانات اصطناعية</span>
</div>
</footer>
</main>
</body></html>
