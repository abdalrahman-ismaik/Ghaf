<div class="flex flex-row-reverse justify-between items-center w-full px-margin-mobile h-touch-target mt-2">

</button>
</div>
</header>

<!-- Hero Area -->
<div class="flex-1 flex flex-col items-center justify-center text-center space-y-8 mt-[-10vh]">
<!-- Typography -->
<div class="space-y-6 max-w-[320px] mx-auto">

</div></h2>

</div><p></p>
</div>
